<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandaförsäljning 2026</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="logo">
        <span class="logo-icon">🐼</span>
        <span class="logo-text">Pandabutiken</span>
      </div>
      <div class="cart-wrapper">
        <button class="cart-btn" onclick="toggleCart()">
          🛒 Varukorg (<span id="cart-count">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container hero-content">
      <h1>Stöd vår insamling!</h1>
      <p>Köp fina pandaprodukter och hjälp oss att nå vårt mål. Enkelt, säkert och direkt på webben.</p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container">
    <div class="section-header">
      <h2>Våra Produkter</h2>
      <p>Välj bland våra samlarobjekt och tillbehör nedan</p>
    </div>

    <!-- Produktgrid -->
    <div id="product-grid" class="product-grid">
      <!-- Produkterna laddas dynamiskt från products.json -->
    </div>
  </main>

  <!-- Varukorg Modal -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Din Varukorg</h3>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="cart-items" class="cart-items">
          <!-- Innehåll laddas via JS -->
        </div>
        <div class="cart-summary">
          <div class="cart-total">
            <span>Totalt:</span>
            <span id="cart-total-price">0 kr</span>
          </div>
        </div>
        
        <!-- Beställningsformulär -->
        <form id="order-form" action="https://formspree.io/f/DIN_FORMSPREE_ID_HÄR" method="POST" class="checkout-form">
          <h4>Kassa</h4>
          <input type="hidden" id="form-cart-data" name="Beställning">
          <div class="form-group">
            <label for="name">Namn</label>
            <input type="text" id="name" name="Namn" placeholder="För- och efternamn" required>
          </div>
          <div class="form-group">
            <label for="email">E-postadresse</label>
            <input type="email" id="email" name="E-post" placeholder="din.epost@exempel.se" required>
          </div>
          <div class="form-group">
            <label for="phone">Telefonnummer (Swish)</label>
            <input type="tel" id="phone" name="Telefon" placeholder="070-123 45 67" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Skicka beställning</button>
        </form>
      </div>
    </div>
  </div>

  <footer>
    <div class="container footer-content">
      <p>© 2026 Pandaförsäljning. Alla rättigheter förbehållna.</p>
    </div>
  </footer>

  <script>
    let products = [];
    let cart = [];

    // Hämta produkter från products.json
    async function fetchProducts() {
      try {
        const response = await fetch('products.json');
        products = await response.json();
        renderProducts();
      } catch (error) {
        console.error('Kunde inte ladda produkter:', error);
      }
    }

    // Rendera ut produktkort
    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-image-wrapper">
            <img src="${p.image}" alt="${p.name}" class="product-image" loading="lazy">
            <span class="product-badge">${p.category}</span>
          </div>
          <div class="product-info">
            <h3 class="product-title">${p.name}</h3>
            <p class="product-description">${p.description}</p>
            <div class="product-footer">
              <span class="product-price">${p.price} kr</span>
              <button class="btn btn-outline" onclick="addToCart(${p.id})">Lägg till</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Lägg till i varukorg
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartUI();
    }

    // Uppdatera varukorgens gränssnitt
    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const itemsEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total-price');
      const formDataEl = document.getElementById('form-cart-data');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      countEl.innerText = totalItems;
      totalEl.innerText = `${totalPrice} kr`;

      if (cart.length === 0) {
        itemsEl.innerHTML = '<p class="empty-cart">Din varukorg är tom.</p>';
      } else {
        itemsEl.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong>
              <div class="cart-item-price">${item.price} kr × ${item.quantity}</div>
            </div>
            <div class="cart-item-controls">
              <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
              <span>${item.quantity}</span>
              <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `).join('');
      }

      // Spara sammanställningen i det dolda formulärfältet
      formDataEl.value = cart.map(i => `${i.name} (${i.quantity}st) - ${i.price * i.quantity}kr`).join(', ') + ` | Totalt: ${totalPrice}kr`;
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    // Stäng modal om man klickar utanför
    window.onclick = function(e) {
      const modal = document.getElementById('cart-modal');
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    }

    fetchProducts();
  </script>
</body>
</html>
